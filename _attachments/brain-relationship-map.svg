<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">Claude Blog Brain wikilink relationship map</title>
  <desc id="desc">Actual Obsidian wikilink graph generated from 257 wiki notes, 27 folder indexes, 8878 resolved wikilinks, and zero unresolved wikilinks in the local parser on 2026-07-09.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 30px Inter,Arial,sans-serif;fill:#111827}
      .sub{font:500 13px Inter,Arial,sans-serif;fill:#475569}
      .node-title{font:700 15px Inter,Arial,sans-serif;fill:#111827}
      .node-meta{font:500 12px Inter,Arial,sans-serif;fill:#334155}
      .label{font:700 12px Inter,Arial,sans-serif;fill:#0f172a}
      .small{font:500 11px Inter,Arial,sans-serif;fill:#475569}
      .edge{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}
      .edge-strong{fill:none;stroke:#334155;stroke-width:3.2;marker-end:url(#arrow)}
      .edge-soft{fill:none;stroke:#94a3b8;stroke-width:1.7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1240" height="760"/>
